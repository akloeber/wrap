# Global image defaults: install runtimes only when one of their commands runs.
# mise handles update checks (24h by default), failures, and pruning. Exact
# versions selected by a project or `mise use --pin` remain pinned.
[settings]
tool_update.global_auto = true

[tools]
# No lazy rustc: pip (and other tools) probe `rustc --version` with a short
# timeout, which would start a toolchain install and abandon it half-done on
# every call. cargo installs the toolchain; rustc appears with it.
rust = { version = "latest", lazy = true, lazy_bins = ["cargo", "rustup"] }
go = { version = "latest", lazy = true }
bun = { version = "latest", lazy = true }
node = { version = "latest", lazy = true }
pnpm = { version = "latest", lazy = true }
python = { version = "latest", lazy = true }
uv = { version = "latest", lazy = true }
